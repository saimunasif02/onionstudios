<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onion Studios</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#120818;--panel:#1d1027;--line:#352045;--txt:#f4ecf7;--dim:#a898b3;--acc:#e8436f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.5 Outfit,'Hind Siliguri',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 4%;background:linear-gradient(#120818,#120818cc 70%,transparent)}
.logo{font-weight:800;font-size:26px;letter-spacing:-.5px;color:var(--acc)}
nav input{margin-left:auto;background:#0008;border:1px solid var(--line);border-radius:6px;padding:7px 12px;width:min(220px,40vw)}
.btn{background:var(--acc);border:0;border-radius:6px;padding:9px 20px;font-weight:600;cursor:pointer}
.btn.alt{background:#ffffff22}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero{min-height:68vh;display:flex;align-items:flex-end;padding:0 4% 56px;background-size:cover;background-position:center top;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,transparent 60%),linear-gradient(90deg,#120818e6 15%,transparent 70%)}
.hero>div{position:relative;max-width:560px}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1.05;margin-bottom:10px}
.hero p{color:#dccfe3;margin-bottom:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .btn{margin-right:8px}
.row{padding:0 4%;margin:26px 0}
.row h2{font-size:19px;margin-bottom:10px}
.scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.card{flex:0 0 auto;width:158px;aspect-ratio:2/3;border-radius:6px;background:var(--panel) center/cover;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s}
.card:hover{transform:scale(1.06);z-index:2}
.card span{position:absolute;inset:auto 0 0;padding:24px 8px 8px;font-size:13px;font-weight:600;background:linear-gradient(transparent,#000d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:90px 4% 30px}
.grid .card{width:auto}
.watch{padding:76px 4% 40px;max-width:1100px;margin:auto}
.stage{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.stage iframe,.stage video{width:100%;height:100%;border:0}
.watch h1{font-size:30px;margin:16px 0 4px}
.meta{color:var(--dim);margin-bottom:12px}
.files a{display:inline-block;margin:4px 6px 0 0;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.empty{padding:140px 4%;text-align:center;color:var(--dim)}
.admin{padding:84px 4% 40px;max-width:900px;margin:auto}
.admin form,.login{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;margin-bottom:22px}
.admin label{font-size:13px;color:var(--dim);display:grid;gap:4px}
.admin input,.admin select,.admin textarea,.login input{background:#0007;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{display:flex;gap:8px;align-items:center}
.up input[type=file]{font-size:12px;padding:4px}
.item{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item img{width:44px;height:64px;object-fit:cover;border-radius:4px;background:var(--panel)}
.item b{flex:1}
.item button{margin-left:4px;padding:6px 12px}
.msg{color:var(--dim);font-size:14px}
@media(max-width:560px){.two{grid-template-columns:1fr}.card{width:120px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav><a class="logo" href="#/">ONION STUDIOS</a><input id="q" type="search" placeholder="Khujun…" aria-label="Search"></nav>
<main id="app"></main>
<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob@0.27.0/client';
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items = [], pw = sessionStorage.getItem('onion-pw') || '', editing = null;

async function load() {
  try { items = await (await fetch('/api/catalog')).json(); } catch { items = []; }
  route();
}
async function save() {
  const r = await fetch('/api/catalog', { method:'POST', headers:{'Content-Type':'application/json','x-admin-password':pw}, body:JSON.stringify(items) });
  if (!r.ok) throw new Error((await r.json()).error || 'Save hoyni');
}
const ytId = u => (u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/) || [])[1];
const playerHTML = u => ytId(u)
  ? `<iframe src="https://www.youtube.com/embed/${ytId(u)}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`
  : `<video src="${esc(u)}" controls autoplay playsinline></video>`;
const card = i => `<div class="card" tabindex="0" role="link" data-id="${i.id}" style="background-image:url('${esc(i.poster)}')"><span>${esc(i.title)}</span></div>`;

function home() {
  if (!items.length) return app.innerHTML = `<div class="empty"><h2>Kono video nei</h2><p>Admin panel (#/admin) theke prothom video add korun.</p></div>`;
  const h = items.find(i => i.featured) || items[0];
  const cats = [...new Set(items.map(i => i.cat || 'Notun'))];
  app.innerHTML = `<section class="hero" style="background-image:url('${esc(h.poster)}')"><div><h1>${esc(h.title)}</h1><p>${esc(h.desc)}</p><button class="btn" data-id="${h.id}">▶ Dekhun</button></div></section>` +
    cats.map(c => `<section class="row"><h2>${esc(c)}</h2><div class="scroll">${items.filter(i => (i.cat || 'Notun') === c).map(card).join('')}</div></section>`).join('');
}
function search(t) {
  const r = items.filter(i => (i.title + i.cat).toLowerCase().includes(t.toLowerCase()));
  app.innerHTML = r.length ? `<div class="grid">${r.map(card).join('')}</div>` : `<div class="empty">Kichu pawa jayni</div>`;
}
function watch(id) {
  const i = items.find(x => x.id === id); if (!i) return home();
  app.innerHTML = `<div class="watch"><div class="stage">${playerHTML(i.video)}</div><h1>${esc(i.title)}</h1><div class="meta">${esc(i.year)} ${i.cat ? '· ' + esc(i.cat) : ''}</div><p>${esc(i.desc)}</p>` +
    ((i.files || []).length ? `<div class="files"><p class="meta">Extra files</p>${i.files.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener" download>${esc(f.name)}</a>`).join('')}</div>` : '') +
    `</div><section class="row"><h2>Aro dekhun</h2><div class="scroll">${items.filter(x => x.id !== id).map(card).join('')}</div></section>`;
  scrollTo(0, 0);
}

function admin() {
  if (!pw) return app.innerHTML = `<div class="admin"><div class="login"><h2>Admin login</h2><input id="pw" type="password" placeholder="Admin password"><button class="btn" id="go">Login</button><p class="msg" id="lm"></p></div></div>`;
  const e = editing ? items.find(i => i.id === editing) : {};
  const f = (k, l, t = 'text') => `<label>${l}<input id="f-${k}" type="${t}" value="${esc(e[k])}"></label>`;
  const up = (k, l) => `<label>${l} (URL din ba upload korun)<div class="up"><input id="f-${k}" value="${esc(e[k])}"><input type="file" data-for="${k}"></div></label>`;
  app.innerHTML = `<div class="admin"><h2>${editing ? 'Edit korun' : 'Notun video add korun'}</h2>
  <form id="form">${f('title', 'Title')}<label>Description<textarea id="f-desc" rows="3">${esc(e.desc)}</textarea></label>
  <div class="two">${f('year', 'Year')}${f('cat', 'Category (jemon Movies, Series, Bangla)')}</div>
  ${up('poster', 'Poster image')}${up('video', 'Video (mp4 link, upload, ba YouTube link)')}
  <label>Extra files (subtitle, PDF, etc.)<input type="file" id="xf" multiple></label><p class="msg" id="xl">${(e.files || []).map(x => esc(x.name)).join(', ')}</p>
  <label><span><input type="checkbox" id="f-featured" style="width:auto" ${e.featured ? 'checked' : ''}> Home page hero te dekhan</span></label>
  <div><button class="btn" type="submit">${editing ? 'Update' : 'Publish'}</button> ${editing ? '<button class="btn alt" type="button" id="cn">Cancel</button>' : ''} <button class="btn alt" type="button" id="lo">Logout</button></div><p class="msg" id="st"></p></form>
  <h2>Shob video (${items.length})</h2>${items.map(i => `<div class="item"><img src="${esc(i.poster)}" alt=""><b>${esc(i.title)}</b><button class="btn alt" data-ed="${i.id}">Edit</button><button class="btn alt" data-del="${i.id}">Delete</button></div>`).join('')}</div>`;
}

const msg = t => { const s = $('#st'); if (s) s.textContent = t; };
let pending = [];
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'xf') { msg('Upload hocche…'); try { for (const file of el.files) { const b = await upload(file.name, file, { access:'public', handleUploadUrl:'/api/upload', clientPayload:pw }); pending.push({ name:file.name, url:b.url }); } $('#xl').textContent += ' ' + pending.map(p => p.name).join(', '); msg('Upload shesh'); } catch (er) { msg(er.message); } }
  else if (el.dataset.for) { const file = el.files[0]; if (!file) return; msg(file.name + ' upload hocche…'); try { const b = await upload(file.name, file, { access:'public', handleUploadUrl:'/api/upload', clientPayload:pw, onUploadProgress:p => msg(Math.round(p.percentage) + '%') }); $('#f-' + el.dataset.for).value = b.url; msg('Upload shesh'); } catch (er) { msg(er.message); } }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'form') return; e.preventDefault();
  const v = k => $('#f-' + k).value.trim(), old = editing ? items.find(i => i.id === editing) : null;
  if (!v('title') || !v('video') || !v('poster')) return msg('Title, poster ar video lagbe');
  const it = { id: editing || Date.now().toString(36), title:v('title'), desc:v('desc'), year:v('year'), cat:v('cat'), poster:v('poster'), video:v('video'), featured:$('#f-featured').checked, files:[...(old?.files || []), ...pending] };
  if (it.featured) items.forEach(i => i.featured = false);
  editing ? items[items.findIndex(i => i.id === editing)] = it : items.unshift(it);
  try { msg('Save hocche…'); await save(); pending = []; editing = null; admin(); msg('Published'); } catch (er) { msg(er.message); }
});
document.addEventListener('click', async e => {
  const t = e.target, c = t.closest('[data-id]');
  if (t.id === 'go') { pw = $('#pw').value; try { await save(); sessionStorage.setItem('onion-pw', pw); admin(); } catch { pw = ''; $('#lm').textContent = 'Password vul'; } }
  else if (t.id === 'lo') { pw = ''; sessionStorage.removeItem('onion-pw'); admin(); }
  else if (t.id === 'cn') { editing = null; pending = []; admin(); }
  else if (t.dataset.ed) { editing = t.dataset.ed; admin(); scrollTo(0, 0); }
  else if (t.dataset.del && confirm('Delete korben?')) { items = items.filter(i => i.id !== t.dataset.del); try { await save(); } catch (er) { alert(er.message); } admin(); }
  else if (c) location.hash = '#/watch/' + c.dataset.id;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('card')) location.hash = '#/watch/' + e.target.dataset.id; });
$('#q').addEventListener('input', e => e.target.value ? search(e.target.value) : route());
function route() {
  const h = location.hash;
  h.startsWith('#/watch/') ? watch(h.slice(8)) : h === '#/admin' ? admin() : home();
}
addEventListener('hashchange', route);
load();
</script>
</body>
</html>
