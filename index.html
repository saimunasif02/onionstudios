<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onion Studios</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#120818;--panel:#1d1027;--line:#352045;--txt:#f4ecf7;--dim:#a898b3;--acc:#e8436f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.5 Outfit,'Hind Siliguri',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 4%;background:linear-gradient(#120818,#120818cc 70%,transparent)}
.logo{font-weight:800;font-size:26px;letter-spacing:-.5px;color:var(--acc)}
nav input{margin-left:auto;background:#0008;border:1px solid var(--line);border-radius:6px;padding:7px 12px;width:min(220px,40vw)}
.btn{background:var(--acc);border:0;border-radius:6px;padding:9px 20px;font-weight:600;cursor:pointer}
.btn.alt{background:#ffffff22}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero{min-height:68vh;display:flex;align-items:flex-end;padding:0 4% 56px;background-size:cover;background-position:center top;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,transparent 60%),linear-gradient(90deg,#120818e6 15%,transparent 70%)}
.hero>div{position:relative;max-width:560px}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1.05;margin-bottom:10px}
.hero p{color:#dccfe3;margin-bottom:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .btn{margin-right:8px}
.row{padding:0 4%;margin:26px 0}
.row h2{font-size:19px;margin-bottom:10px}
.scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.card{flex:0 0 auto;width:158px;aspect-ratio:2/3;border-radius:6px;background:var(--panel) center/cover;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s}
.card:hover{transform:scale(1.06);z-index:2}
.card span{position:absolute;inset:auto 0 0;padding:24px 8px 8px;font-size:13px;font-weight:600;background:linear-gradient(transparent,#000d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:90px 4% 30px}
.grid .card{width:auto}
.watch{padding:76px 4% 40px;max-width:1100px;margin:auto}
.stage{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.stage iframe,.stage video{width:100%;height:100%;border:0}
.watch h1{font-size:30px;margin:16px 0 4px}
.meta{color:var(--dim);margin-bottom:12px}
.files a{display:inline-block;margin:4px 6px 0 0;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.empty{padding:140px 4%;text-align:center;color:var(--dim)}
.admin{padding:84px 4% 40px;max-width:900px;margin:auto}
.admin form,.login{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;margin-bottom:22px}
.admin label{font-size:13px;color:var(--dim);display:grid;gap:4px}
.admin input,.admin select,.admin textarea,.login input{background:#0007;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{display:flex;gap:8px;align-items:center}
.up input[type=file]{font-size:12px;padding:4px}
.item{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item img{width:44px;height:64px;object-fit:cover;border-radius:4px;background:var(--panel)}
.item b{flex:1}
.item button{margin-left:4px;padding:6px 12px}
.msg{color:var(--dim);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
footer{padding:30px 4%;color:var(--dim);font-size:13px;text-align:center}
.tag{font-size:11px;background:#ffffff22;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:400}
.item small{display:block;color:var(--dim);font-weight:400}
.chip{background:#ffffff18;border:0;border-radius:14px;padding:3px 10px;margin:2px 4px 2px 0;font-size:13px;cursor:pointer}
.chk{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;flex-direction:row}
.chk input{width:auto!important}
.admin h2{margin:6px 0 12px}
.meta{white-space:pre-wrap}
#intro{position:fixed;inset:0;z-index:100;background:#07030b;display:grid;place-items:center;overflow:hidden;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
#intro svg{position:absolute;width:min(62vmin,400px);fill:none;stroke:var(--acc);stroke-width:1.6;opacity:.85;animation:fade 1s 3s forwards}
#intro ellipse,#intro path{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.5s ease forwards}
#intro ellipse:nth-child(2){animation-delay:.25s}#intro ellipse:nth-child(3){animation-delay:.5s}#intro path{animation-delay:.8s}
#wm{position:relative;font-weight:800;font-size:clamp(34px,9vw,92px);color:var(--acc);opacity:0;white-space:nowrap;animation:wm 3s 1.1s ease-out forwards}
.streak{position:absolute;left:0;top:50%;width:100%;height:3px;background:linear-gradient(90deg,transparent,#fff,var(--acc),transparent);box-shadow:0 0 40px 12px var(--acc);transform:translateX(-110%);animation:sw 1s 1.9s ease-in forwards}
#skip{position:absolute;right:4%;bottom:5%;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 14px;color:var(--dim);cursor:pointer}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
@keyframes sw{to{transform:translateX(110%)}}
@keyframes wm{0%{opacity:0;transform:scale(.7);letter-spacing:-.06em;filter:blur(14px)}25%{opacity:1;filter:blur(0);text-shadow:0 0 30px var(--acc)}100%{opacity:1;transform:scale(1.2);letter-spacing:.1em;text-shadow:0 0 60px var(--acc)}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}
@media(max-width:560px){.two{grid-template-columns:1fr}.card{width:120px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="intro"><svg viewBox="0 0 200 240" aria-hidden="true"><ellipse cx="100" cy="140" rx="80" ry="95"/><ellipse cx="100" cy="140" rx="55" ry="95"/><ellipse cx="100" cy="140" rx="28" ry="95"/><path d="M100 45C100 25 92 12 84 2"/></svg><div id="wm">ONION STUDIOS</div><div class="streak"></div><button id="skip">Skip</button></div>
<nav><a class="logo" href="#/">ONION STUDIOS</a><input id="q" type="search" placeholder="Khujun…" aria-label="Search"></nav>
<main id="app"></main>
<footer id="ft"></footer>
<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob@0.27.0/client';
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF = { name:'ONION STUDIOS', accent:'#e8436f', tag:'© Onion Studios. Shob adhikar songrokkhito.', order:'' };
let items = [], S = { ...DEF }, pw = sessionStorage.getItem('onion-pw') || '', editing = null, tab = 'videos', curFiles = [];

const poster = (t, a, b) => {
  const w = t.split(' '), y0 = 540 - (w.length - 1) * 50;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="600" fill="url(#g)"/><circle cx="300" cy="170" r="110" fill="#fff" fill-opacity=".12"/>${w.map((x, i) => `<text x="28" y="${y0 + i * 50}" font-family="Arial" font-weight="800" font-size="44" fill="#fff">${x}</text>`).join('')}</svg>`);
};
const demo = () => {
  const B = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/';
  const m = [
    ['Big Buck Bunny','BigBuckBunny','Trending','2008','#e8436f','#3b1457','Ek bishal khorgosh ar tin dushtu pranir moja-r golpo.'],
    ['Sintel','Sintel','Trending','2010','#2a7fff','#1b1033','Ek meye tar hariye jawa bondhur khoje dragon-er desh-e jay.'],
    ['Tears of Steel','TearsOfSteel','Trending','2012','#ff8a3d','#2a0f2e','Bhobishyoter Amsterdam-e robot ar manusher ladai.'],
    ['Elephants Dream','ElephantsDream','Trending','2006','#27c4a8','#16213e','Duijon osamanyo manusher rohoshyomoy jogot-e obhijan.'],
    ['For Bigger Blazes','ForBiggerBlazes','Short Clips','2013','#f43f5e','#4c0519','Choto, jhoktoke ekta clip.'],
    ['For Bigger Escapes','ForBiggerEscapes','Short Clips','2013','#a855f7','#2e1065','Palanor romanchokor ek jhalok.'],
    ['For Bigger Fun','ForBiggerFun','Short Clips','2013','#eab308','#422006','Hashi-khushir choto clip.'],
    ['For Bigger Joyrides','ForBiggerJoyrides','Short Clips','2013','#06b6d4','#083344','Joyride-er moja ek nimeshe.'],
    ['Subaru Outback','SubaruOutbackOnStreetAndDirt','Auto and Travel','2013','#84cc16','#1a2e05','Rasta ar kada-r upor gari-r porikkha.'],
    ['Bullrun Rally','WeAreGoingOnBullrun','Auto and Travel','2013','#ef4444','#450a0a','Bullrun rally-r pothe ek dol bondhu.'],
    ['Car For A Grand','WhatCarCanYouGetForAGrand','Auto and Travel','2013','#14b8a6','#042f2e','Kom taka-y kon gari paowa jay?'],
    ['GTI Review','VolkswagenGTIReview','Auto and Travel','2013','#6366f1','#1e1b4b','Volkswagen GTI-er shohoj review.']
  ];
  return m.map((x, n) => ({ id:'demo' + n, title:x[0], video:B + x[1] + '.mp4', cat:x[2], year:x[3], poster:poster(x[0], x[4], x[5]), desc:x[6], duration:'', rating:'', featured:n === 0, hidden:false, files:[] }));
};

async function load() {
  try {
    const d = await (await fetch('/api/catalog')).json();
    if (Array.isArray(d) && d.length) items = d;
    else if (d && d.items) { items = d.items; S = { ...DEF, ...d.settings }; }
    else items = demo();
  } catch { items = demo(); }
  route();
}
async function post(body) {
  const r = await fetch('/api/catalog', { method:'POST', headers:{'Content-Type':'application/json','x-admin-password':pw}, body:JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Server error ' + r.status + ' (api file ba Blob setup check korun)');
}
const save = () => post({ settings:S, items });
const ytId = u => (u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/) || [])[1];
const playerHTML = u => ytId(u)
  ? `<iframe src="https://www.youtube.com/embed/${ytId(u)}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`
  : `<video src="${esc(u)}" controls autoplay playsinline></video>`;
const card = i => `<div class="card" tabindex="0" role="link" data-id="${i.id}" style="background-image:url('${esc(i.poster)}')"><span>${esc(i.title)}</span></div>`;
const vis = () => items.filter(i => !i.hidden);
const metaOf = i => [i.year, i.rating, i.duration, i.cat].filter(Boolean).map(esc).join('  |  ');

function skin() {
  document.title = S.name;
  $('.logo').textContent = S.name;
  if ($('#wm')) $('#wm').textContent = S.name;
  $('#ft').textContent = S.tag;
  document.documentElement.style.setProperty('--acc', S.accent);
}
function home() {
  const v = vis();
  if (!v.length) return app.innerHTML = `<div class="empty"><h2>Kono video nei</h2><p>Admin panel (#/admin) theke prothom video add korun.</p></div>`;
  const h = v.find(i => i.featured) || v[0];
  const cats = [...new Set(v.map(i => i.cat || 'Notun'))];
  const ord = S.order.split(',').map(s => s.trim()).filter(Boolean);
  cats.sort((a, b) => (ord.indexOf(a) + 1 || 999) - (ord.indexOf(b) + 1 || 999));
  app.innerHTML = `<section class="hero" style="background-image:url('${esc(h.poster)}')"><div><h1>${esc(h.title)}</h1><div class="meta">${metaOf(h)}</div><p>${esc(h.desc)}</p><button class="btn" data-id="${h.id}">▶ Dekhun</button></div></section>` +
    cats.map(c => `<section class="row"><h2>${esc(c)}</h2><div class="scroll">${v.filter(i => (i.cat || 'Notun') === c).map(card).join('')}</div></section>`).join('');
}
function search(t) {
  const r = vis().filter(i => (i.title + i.cat).toLowerCase().includes(t.toLowerCase()));
  app.innerHTML = r.length ? `<div class="grid">${r.map(card).join('')}</div>` : `<div class="empty">Kichu pawa jayni</div>`;
}
function watch(id) {
  const i = items.find(x => x.id === id); if (!i) return home();
  app.innerHTML = `<div class="watch"><div class="stage">${playerHTML(i.video)}</div><h1>${esc(i.title)}</h1><div class="meta">${metaOf(i)}</div><p>${esc(i.desc)}</p>` +
    ((i.files || []).length ? `<div class="files"><p class="meta">Extra files</p>${i.files.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener" download>${esc(f.name)}</a>`).join('')}</div>` : '') +
    `</div><section class="row"><h2>Aro dekhun</h2><div class="scroll">${vis().filter(x => x.id !== id).map(card).join('')}</div></section>`;
  scrollTo(0, 0);
}

const chips = () => curFiles.map((f, n) => `<button type="button" class="chip" data-rf="${n}">${esc(f.name)} ✕</button>`).join('');
function vids() {
  const e = editing ? items.find(i => i.id === editing) : {};
  const f = (k, l, t = 'text') => `<label>${l}<input id="f-${k}" type="${t}" value="${esc(e[k])}"></label>`;
  const up = (k, l) => `<label>${l}<div class="up"><input id="f-${k}" value="${esc(e[k])}" placeholder="URL boshan"><input type="file" data-for="${k}"></div></label>`;
  return `<h2>${editing ? 'Edit korun' : 'Notun video add korun'}</h2>
  <form id="form">${f('title', 'Title')}<label>Description<textarea id="f-desc" rows="3">${esc(e.desc)}</textarea></label>
  <div class="two">${f('year', 'Year')}${f('cat', 'Category (jemon Movies, Series)')}${f('duration', 'Duration (jemon 1h 45m)')}${f('rating', 'Rating (jemon U, 13+, 18+)')}</div>
  ${up('poster', 'Poster image (upload ba URL)')}${up('video', 'Video (mp4 upload, mp4 link, ba YouTube link)')}
  <label>Extra files (subtitle, PDF, etc.)<input type="file" id="xf" multiple></label><div id="xl">${chips()}</div>
  <label class="chk"><input type="checkbox" id="f-featured" ${e.featured ? 'checked' : ''}> Home page hero te dekhan</label>
  <label class="chk"><input type="checkbox" id="f-hidden" ${e.hidden ? 'checked' : ''}> Lukiye rakhun (draft, public e dekha jabe na)</label>
  <div><button class="btn" type="submit">${editing ? 'Update' : 'Publish'}</button> ${editing ? '<button class="btn alt" type="button" id="cn">Cancel</button>' : ''}</div><p class="msg" id="st"></p></form>
  <h2>Shob video (${items.length})</h2>${items.map(i => `<div class="item"><img src="${esc(i.poster)}" alt=""><b>${esc(i.title)}${i.hidden ? '<span class="tag">draft</span>' : ''}${i.featured ? '<span class="tag">hero</span>' : ''}<small>${esc(i.cat)}</small></b><button class="btn alt" data-mv="${i.id}:-1" aria-label="Upore">↑</button><button class="btn alt" data-mv="${i.id}:1" aria-label="Niche">↓</button><button class="btn alt" data-ed="${i.id}">Edit</button><button class="btn alt" data-del="${i.id}">Delete</button></div>`).join('')}`;
}
function sets() {
  return `<h2>Site settings</h2><form id="sform">
  <label>Site-er nam<input id="s-name" value="${esc(S.name)}"></label>
  <label>Rong (accent)<input id="s-accent" type="color" value="${esc(S.accent)}" style="height:40px;padding:2px"></label>
  <label>Category-r kromo (comma diye, jemon Trending, Movies, Series)<input id="s-order" value="${esc(S.order)}"></label>
  <label>Footer lekha<input id="s-tag" value="${esc(S.tag)}"></label>
  <div><button class="btn" type="submit">Save settings</button> <button class="btn alt" type="button" id="rs">Default rong/nam</button></div><p class="msg" id="st"></p></form>`;
}
function bak() {
  return `<h2>Backup ar restore</h2><div class="login"><p class="msg">Shob video, setting ek JSON file e namiye rakhun, pore abar upload kore ferot anun.</p>
  <div><button class="btn" id="dl">Backup download</button></div>
  <label>Backup file restore korun<input type="file" id="imp" accept=".json"></label>
  <div><button class="btn alt" id="dm">Demo content abar load korun</button> <button class="btn alt" id="clr">Shob muchhe fela</button></div><p class="msg" id="st"></p></div>`;
}
function admin() {
  if (!pw) return app.innerHTML = `<div class="admin"><div class="login"><h2>Admin login</h2><input id="pw" type="password" placeholder="Admin password"><button class="btn" id="go">Login</button><p class="msg" id="lm"></p></div></div>`;
  const names = { videos:'Videos', settings:'Site settings', backup:'Backup' };
  app.innerHTML = `<div class="admin"><div class="tabs">${Object.keys(names).map(t => `<button class="btn ${tab === t ? '' : 'alt'}" data-tab="${t}">${names[t]}</button>`).join('')}<button class="btn alt" id="lo">Logout</button></div>${tab === 'videos' ? vids() : tab === 'settings' ? sets() : bak()}</div>`;
}

const msg = t => { const s = $('#st'); if (s) s.textContent = t; };
const up = (file, on) => upload(file.name, file, { access:'public', handleUploadUrl:'/api/upload', clientPayload:pw, onUploadProgress:on });
const commit = async ok => { try { msg('Save hocche…'); await save(); skin(); admin(); msg(ok); } catch (er) { msg(er.message); } };

document.addEventListener('change', async e => {
  const el = e.target;
  try {
    if (el.id === 'xf') { for (const file of el.files) { msg(file.name + ' upload hocche…'); const b = await up(file); curFiles.push({ name:file.name, url:b.url }); } $('#xl').innerHTML = chips(); msg('Upload shesh'); }
    else if (el.dataset.for) { const file = el.files[0]; if (!file) return; const b = await up(file, p => msg(file.name + ' ' + Math.round(p.percentage) + '%')); $('#f-' + el.dataset.for).value = b.url; msg('Upload shesh'); }
    else if (el.id === 'imp') {
      const d = JSON.parse(await el.files[0].text()), list = Array.isArray(d) ? d : d.items;
      if (!Array.isArray(list) || !confirm('Ekhon-kar shob data replace hobe. Cholbe?')) return;
      items = list; if (d.settings) S = { ...DEF, ...d.settings }; await commit('Restore hoyeche');
    }
  } catch (er) { msg(er.message); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'sform') { S = { name:$('#s-name').value.trim() || DEF.name, accent:$('#s-accent').value, order:$('#s-order').value, tag:$('#s-tag').value }; return commit('Settings save hoyeche'); }
  if (e.target.id !== 'form') return;
  const v = k => $('#f-' + k).value.trim();
  if (!v('title') || !v('video') || !v('poster')) return msg('Title, poster ar video lagbe');
  const it = { id:editing || Date.now().toString(36), title:v('title'), desc:v('desc'), year:v('year'), cat:v('cat'), duration:v('duration'), rating:v('rating'), poster:v('poster'), video:v('video'), featured:$('#f-featured').checked, hidden:$('#f-hidden').checked, files:[...curFiles] };
  if (it.featured) items.forEach(i => i.featured = false);
  editing ? items[items.findIndex(i => i.id === editing)] = it : items.unshift(it);
  editing = null; curFiles = []; await commit('Published');
});
document.addEventListener('click', async e => {
  const t = e.target, c = t.closest('[data-id]');
  if (t.id === 'go') { pw = $('#pw').value; try { await post({ verify:true }); sessionStorage.setItem('onion-pw', pw); admin(); } catch (er) { pw = ''; $('#lm').textContent = er.message; } }
  else if (t.id === 'lo') { pw = ''; sessionStorage.removeItem('onion-pw'); admin(); }
  else if (t.id === 'cn') { editing = null; curFiles = []; admin(); }
  else if (t.dataset.tab) { tab = t.dataset.tab; admin(); }
  else if (t.dataset.rf) { curFiles.splice(+t.dataset.rf, 1); $('#xl').innerHTML = chips(); }
  else if (t.dataset.ed) { editing = t.dataset.ed; curFiles = [...(items.find(i => i.id === editing).files || [])]; admin(); scrollTo(0, 0); }
  else if (t.dataset.mv) { const [id, d] = t.dataset.mv.split(':'), n = items.findIndex(i => i.id === id), m = n + +d; if (m < 0 || m >= items.length) return; [items[n], items[m]] = [items[m], items[n]]; await commit(''); }
  else if (t.dataset.del && confirm('Delete korben?')) { items = items.filter(i => i.id !== t.dataset.del); await commit('Deleted'); }
  else if (t.id === 'rs') { S = { ...DEF }; await commit('Default e ferot gelo'); }
  else if (t.id === 'dl') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ settings:S, items }, null, 2)], { type:'application/json' })); a.download = 'onion-backup.json'; a.click(); }
  else if (t.id === 'dm' && confirm('Ekhon-kar shob muchhe demo content boshbe. Cholbe?')) { items = demo(); await commit('Demo load hoyeche'); }
  else if (t.id === 'clr' && confirm('Shob video muchhe jabe. Nishchit?')) { items = []; await commit('Shob muchha hoyeche'); }
  else if (c) location.hash = '#/watch/' + c.dataset.id;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('card')) location.hash = '#/watch/' + e.target.dataset.id; });
$('#q').addEventListener('input', e => e.target.value ? search(e.target.value) : route());
function route() {
  skin();
  const h = location.hash;
  h.startsWith('#/watch/') ? watch(h.slice(8)) : h === '#/admin' ? admin() : home();
}
addEventListener('hashchange', route);
load();

(function () {
  const el = $('#intro');
  if (!el) return;
  if (sessionStorage.getItem('onion-intro') || location.hash === '#/admin' || matchMedia('(prefers-reduced-motion:reduce)').matches) return el.remove();
  sessionStorage.setItem('onion-intro', '1');
  const end = () => { el.classList.add('out'); setTimeout(() => el.remove(), 800); };
  setTimeout(end, 4300);
  $('#skip').onclick = end;
  try { // low "thump" sound; browsers may block it until the visitor interacts
    const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + 1.9;
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(35, t + 1.2);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.7, t + .05); g.gain.exponentialRampToValueAtTime(.001, t + 1.6);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 1.7);
  } catch {}
})();
</script>
</body>
</html>
